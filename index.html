<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: rgb(0, 0, 0);
        margin: 0;
      }

      #webgl {
        pointer-events: none;
      }

      #ui-app {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      #ui {
        position: absolute;
        overflow: hidden;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      #monitor-videos {
        pointer-events: none;
        position: "absolute";
        opacity: 0;
        width: 0;
        height: 0;
        top: 0;
        left: 0;
      }

      #css {
        cursor: pointer;
      }

      #ui-interactive {
        position: absolute;
        top: 0;
        left: 0;
        width: 256px;
      }

      video {
        position: absolute;
        top: 0;
        pointer-events: none;
      }
    </style>

    <title>Connor Love — Interactive Portfolio</title>
    <meta
      name="description"
      content="Connor Love is a freelance web developer in Columbus, Ohio. Explore his work through an interactive 3D desktop."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="canonical" href="https://experience.connorlove.com/" />
    <meta property="og:title" content="Connor Love — Interactive Portfolio" />
    <meta
      property="og:description"
      content="Websites, web apps, and interactive experiences. Step inside Connor's desktop."
    />
    <meta property="og:url" content="https://experience.connorlove.com/" />
    <script type="module" src="/src/script.ts"></script>
  </head>

  <body>
    <div id="css"></div>
    <div id="webgl"></div>
    <div id="overlay"></div>
    <div id="ui-interactive"></div>
    <div id="ui"></div>
    <div id="monitor-videos">
      <video
        id="video-1"
        muted
        loop
        autoplay
        width="0"
        height="0"
        src="/textures/monitor/video/base-static.mp4"
        style="opacity: 0"
      ></video>
      <video
        id="video-2"
        muted
        loop
        autoplay
        width="0"
        height="0"
        src="/textures/monitor/video/static-texture-layer.mp4"
        style="opacity: 0"
      ></video>
    </div>
    <a class="desktop-shortcut" href="/desktop.html"
      >Open desktop
      <svg
        class="ui-arrow"
        style="width: 1em; height: 1em; vertical-align: -0.13em"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17 17 7M7 7h10v10" /></svg
    ></a>
  </body>
</html>
